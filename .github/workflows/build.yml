name: build-exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CGV-Seat-Watcher
          --collect-all playwright --collect-all customtkinter
          --hidden-import cgv_macro.watcher --hidden-import cgv_macro.replayer
          --hidden-import cgv_macro.recorder --hidden-import cgv_macro.cgv_api
          --hidden-import cgv_macro.notifier --hidden-import cgv_macro.config
          --hidden-import cgv_macro.event_watch --hidden-import cgv_macro.hub
          --hidden-import cgv_macro.relogin
          app.py

      # 태그 빌드는 Release 에 exe 가 붙으므로 artifact 업로드는 중복이다.
      # 매 릴리스마다 50MB 씩 쌓여 artifact 저장 용량(quota)을 터뜨렸고, 그 실패가
      # 곧바로 Release 단계를 스킵시켜 배포가 안 됐다. 태그 빌드에선 올리지 않는다.
      - name: Upload artifact (non-tag builds only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: CGV-Seat-Watcher
          path: dist/CGV-Seat-Watcher.exe
          retention-days: 7

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CGV-Seat-Watcher.exe
