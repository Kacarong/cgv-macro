# =============================================================
# CGV 상영 오픈/취소표 감지 + 디스코드 알림 설정 예시
# 이 파일을 복사해 config.yaml 로 쓰거나, GUI(cgv_gui.py)로 설정하세요.
# 무인증 CGV API 를 폴링합니다 — 로그인/브라우저 불필요.
# =============================================================

# ---------- 감시 대상 (여러 개 등록 가능) ----------
targets:
  - name: "오디세이 센텀시티"       # 알림에 표시할 별칭(자유)
    movie: "오디세이"               # 영화명(부분일치). movie_code 있으면 우선
    movie_code: ""                  # 선택: CGV movNo (예: 30001323)
    theater: "센텀시티"             # 극장명(부분일치) 또는 theater_code
    theater_code: ""                # 선택: CGV siteNo (예: 0089)
    date: "2026-08-19"              # YYYY-MM-DD
    time_from: "00:00"              # 감시 시간대 시작(비우면 하루 전체)
    time_to: "23:59"                # 끝
    screen_type: ""                 # 선택: "IMAX" "4DX" "SCREENX" 등 부분일치

# ---------- 폴링 ----------
poll:
  interval_seconds: 45              # 30 이상 권장(과도한 요청 방지)
  jitter_seconds: 15                # 매 주기 0~N초 랜덤 지터

# ---------- 알림 조건 ----------
alerts:
  on_showtime_open: true            # 회차(상영)가 새로 열림
  on_seats_available: true          # 잔여석 존재
  on_soldout_to_available: true     # 매진 → 잔여석 전환(취소표)
  min_remaining_seats: 1            # 잔여석이 이 값 이상일 때만 알림

# ---------- 디스코드 ----------
discord:
  webhook_url: "https://discord.com/api/webhooks/XXXXX/YYYYY"
  mention: ""                       # 선택: "<@사용자ID>" 또는 "@everyone"

# ---------- 오류 처리 ----------
errors:
  max_retries: 3
  retry_backoff_seconds: 5
  alert_after_consecutive_failures: 5
  error_alert_cooldown_seconds: 900

# ---------- 로그 ----------
logging:
  dir: "./logs"
  level: "INFO"
